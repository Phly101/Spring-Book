services:
  library_db:
    image: postgres:16-alpine
    container_name: spring_book_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    image: phly101/spring_book_app:v1
    container_name: library_backend
    depends_on:
      library_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: library_db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
volumes:
  postgres_data:
  
